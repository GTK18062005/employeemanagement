spring.application.name=StaffManagementSystem
server.port=8080

# Database
spring.datasource.url=jdbc:h2:mem:staffdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=true

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.defer-datasource-initialization=true

# JWT Security - Use a strong secret (256-bit)
jwt.secret=mySuperSecretKeyThatIsAtLeast256BitsLong1234567890abcdefghijklmnopqrstuvwxyz
jwt.expiration=86400000

# CORS - Allow React frontend
spring.mvc.cors.allowed-origins=http://localhost:3000
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true
# Lombok configuration
lombok.anyConstructor.addConstructorProperties=true
# Temporarily disable bean validation for testing
spring.jpa.properties.jakarta.persistence.validation.mode=none
# Enable @Slf4j
lombok.log.fieldName=log
lombok.log.fieldIsStatic=true
# Logging
logging.level.com.staffmanagement=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG