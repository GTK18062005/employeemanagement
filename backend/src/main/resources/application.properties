server.port=8081

spring.application.name=backend

# ============================================================
# SUPABASE POSTGRESQL
# ============================================================
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

jwt.secret=${JWT_SECRET:VGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBsb2NhbCBkZXY=}
jwt.expiration=${JWT_EXPIRATION:3600000}

admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
admin.bootstrap.username=${ADMIN_USERNAME:admin}
admin.bootstrap.password=${ADMIN_PASSWORD:admin123}
